<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cart - SACHDEVA OPTICALS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="container" style="padding:16px 0;display:flex;align-items:center;gap:12px">
    <a href="index.html" class="site-logo-link"><img src="images/logo.png" alt="Sachdeva Opticals" class="site-logo" onerror="this.onerror=null;this.src='images/logo.svg'"/></a>
    <a href="index.html">← Back to shop</a>
  </header>
  <main class="container" style="padding:20px 0">
    <h2>Your Cart</h2>
    <div id="cart-container"></div>
    <div style="margin-top:12px"><button id="checkout-btn-main" class="button">Proceed to Checkout</button></div>
  </main>
  <script src="script.js"></script>
  <script>
    function renderCartPage(){
      const ct = document.getElementById('cart-container');
      const cart = getCart();
      if (!ct) return;
      if (cart.length === 0) { ct.innerHTML = '<p>Your cart is empty.</p>'; return; }
      ct.innerHTML = cart.map(i=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><div><strong>${i.name}</strong><div style="color:#666">Qty: ${i.qty}</div></div><div>${formatPrice(i.qty * i.price)}</div></div>`).join('');
    }
    document.addEventListener('DOMContentLoaded', ()=>{
      renderCartPage();
      document.getElementById('checkout-btn-main').addEventListener('click', ()=>{
        // open drawer checkout if present
        if (document.getElementById('cart-drawer')) showCheckoutForm(); else location.href='checkout.html';
      });
    });
  </script>
</body>
</html>
